plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33 // Target API level, adjust as needed
    defaultConfig {
        applicationId "com.example.webviewapp"
        minSdkVersion 21 // Minimum API level
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.example.webviewapp' // Add this line
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' // Example, use latest
    implementation 'com.google.android.material:material:1.11.0' // Example, use latest
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.5.1' // Added for WebView testing
}
